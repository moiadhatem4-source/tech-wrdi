<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>حائط الأمل | تِك وردي</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"></head>
<body data-page="wall"><div id="hdr"></div>
<main><section><div class="wrap"><h2>حائط الأمل</h2><p class="sub">اكتب كلمة دعم قصيرة. تظهر رسالتك للجميع فور إرسالها.</p>
<form class="panel" id="f" style="max-width:640px"><label for="nm">اسمك (اختياري)</label><input id="nm" maxlength="30" autocomplete="nickname">
<label for="tx">رسالتك</label><textarea id="tx" rows="4" maxlength="280" required minlength="2"></textarea>
<div class="row" style="align-items:center"><button class="btn" id="go">إرسال الرسالة</button><span class="note" id="st" role="status"></span></div></form>
<div class="msgs" id="list" aria-live="polite"></div></div></section></main><div id="ftr"></div>
<script src="db.js"></script><script src="shell.js"></script>
<script>
const list=document.getElementById("list"),st=document.getElementById("st");
function ago(t){const m=Math.floor((Date.now()-t)/6e4);return m<1?"الآن":m<60?`قبل ${m} دقيقة`:m<1440?`قبل ${Math.floor(m/60)} ساعة`:`قبل ${Math.floor(m/1440)} يوم`}
async function load(){try{const d=await api.get("messages",'?orderBy="$key"&limitToLast=60');
 const a=Object.values(d||{}).reverse();
 list.innerHTML=a.length?a.map(m=>`<article class="msg"><p>${esc(m.text)}</p><small>${esc(m.name||"مجهول")} · ${ago(m.ts)}</small></article>`).join(""):'<p class="note">كن أول من يكتب رسالة 💗</p>'}
 catch(e){list.innerHTML='<p class="note err">تعذّر تحميل الرسائل. تأكد من الاتصال وقواعد قاعدة البيانات.</p>'}}
f.addEventListener("submit",async e=>{e.preventDefault();
 if(Date.now()-(+localStorage.lastMsg||0)<3e4){st.textContent="انتظر نصف دقيقة قبل رسالة جديدة.";return}
 go.disabled=true;st.textContent="جارٍ الإرسال…";
 try{await api.push("messages",{name:nm.value.trim().slice(0,30)||"مجهول",text:tx.value.trim(),ts:TS});
  localStorage.lastMsg=Date.now();tx.value="";st.textContent="وصلت رسالتك، شكرًا 💗";await load()}
 catch(e){st.textContent="تعذّر الإرسال، حاول لاحقًا.";st.className="note err"}
 go.disabled=false});
load();setInterval(load,20000);
</script></body></html>
